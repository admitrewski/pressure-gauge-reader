bundle:
  name: gauge-review

variables:
  files_path:
    description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)
  files_id:
    description: Full name of the raw UC volume (catalog.schema.volume) the app reads gauge images from
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.

resources:
  apps:
    app:
      name: "gauge-review"
      description: "Pressure Gauge Reader: review AI gauge readings, override with a reason, ask Genie"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
        - files.files

      # The resources which this app has access to.
      resources:
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://fevm-serverless-stable-kx6lwb.cloud.databricks.com

    variables:
      files_path: /Volumes/serverless_stable_kx6lwb_catalog/pressure_gauge/raw
      files_id: serverless_stable_kx6lwb_catalog.pressure_gauge.raw
      genie_space_id: 01f1c1856cf81e78abbc04e6f1863c80
      genie_space_name: Gauge Inspection Readings
      postgres_branch: projects/pressure-gauge-reader/branches/production
      postgres_database: projects/pressure-gauge-reader/branches/production/databases/databricks-postgres
      postgres_project: projects/pressure-gauge-reader
