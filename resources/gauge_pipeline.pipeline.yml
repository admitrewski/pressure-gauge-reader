resources:
  pipelines:
    gauge_pipeline:
      name: pressure-gauge-reader-pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      photon: true
      libraries:
        - glob:
            include: ../src/pipeline/transformations/**
      configuration:
        gauge.vlm_model: system.ai.gpt-5-5
        gauge.raw_path: /Volumes/${var.catalog}/${var.schema}/raw
        gauge.review_threshold: "0.7"
        gauge.overrides_history_table: ${var.catalog}.${var.schema}.lb_reading_overrides_history
        # Vision-model cost estimate (gold_vlm_usage_daily): published GPT-5.5 pay-per-token rates
        # (databricks.com/product/pricing/proprietary-foundation-model-serving) x the SKU list price.
        gauge.price_sku: ENTERPRISE_OPENAI_MODEL_SERVING
        gauge.dbu_per_m_input: "71.429"
        gauge.dbu_per_m_cache_read: "7.143"
        gauge.dbu_per_m_output: "428.571"
